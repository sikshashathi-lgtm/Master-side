    <!-- JavaScript Navigation & Interactive Handlers -->
    <script>
        let currentPortalUrl = "https://sikshashathi-lgtm.github.io/Docdarta/";

        // Switch Top Category Tabs
        function switchCategory(category) {
            const btnTeacher = document.getElementById('cat-btn-teacher');
            const btnGeneral = document.getElementById('cat-btn-general');
            const subTeacher = document.getElementById('subnav-teacher');
            const subGeneral = document.getElementById('subnav-general');

            if (category === 'teacher') {
                btnTeacher.className = "cat-tab flex items-center gap-2 px-4 py-1.5 text-xs lg:text-sm font-semibold rounded-lg transition-all duration-200 bg-gradient-to-r from-sky-600 to-indigo-600 text-white shadow-md shadow-sky-500/20 border border-sky-400/30";
                btnGeneral.className = "cat-tab flex items-center gap-2 px-4 py-1.5 text-xs lg:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
                
                subTeacher.classList.remove('hidden');
                subGeneral.classList.add('hidden');

                const firstSubBtn = subTeacher.querySelector('button');
                if (firstSubBtn) firstSubBtn.click();
            } else {
                btnGeneral.className = "cat-tab flex items-center gap-2 px-4 py-1.5 text-xs lg:text-sm font-semibold rounded-lg transition-all duration-200 bg-gradient-to-r from-sky-600 to-indigo-600 text-white shadow-md shadow-sky-500/20 border border-sky-400/30";
                btnTeacher.className = "cat-tab flex items-center gap-2 px-4 py-1.5 text-xs lg:text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-900";
                
                subGeneral.classList.remove('hidden');
                subTeacher.classList.add('hidden');

                const firstSubBtn = subGeneral.querySelector('button');
                if (firstSubBtn) firstSubBtn.click();
            }
        }

        // Load Portal URL into iframe
        function loadPortal(url, element) {
            currentPortalUrl = url;
            showSpinner();
            document.getElementById('main-frame').src = url;

            // Reset sub-tab styling
            document.querySelectorAll('.sub-tab').forEach(btn => {
                btn.className = "sub-tab text-xs font-medium px-3.5 py-1.5 rounded-full border border-slate-800 bg-slate-900/90 text-slate-300 hover:border-slate-700 hover:bg-slate-800/80 hover:text-sky-300 transition-all duration-150 flex items-center gap-2";
            });

            // Set active pill highlight
            element.className = "sub-tab text-xs font-semibold px-3.5 py-1.5 rounded-full border border-sky-500/60 bg-sky-500/15 text-sky-200 transition-all duration-150 flex items-center gap-2 shadow-sm shadow-sky-500/20";
        }

        // Open current page in a new browser tab
        function openInNewTab() {
            window.open(currentPortalUrl, '_blank');
        }

        // Toggle Top Controls / Header visibility
        function toggleTopControls() {
            const wrapper = document.getElementById('top-control-wrapper');
            const restoreBtn = document.getElementById('restore-btn');

            if (wrapper.classList.contains('hidden-bar')) {
                wrapper.classList.remove('hidden-bar');
                restoreBtn.classList.remove('visible-btn');
            } else {
                wrapper.classList.add('hidden-bar');
                restoreBtn.classList.add('visible-btn');
            }
        }

        // Toggle Fullscreen mode
        function toggleFullscreen() {
            const fsBtnIcon = document.querySelector('#fullscreen-btn i');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
                if (fsBtnIcon) fsBtnIcon.className = "fa-solid fa-compress text-amber-400";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                if (fsBtnIcon) fsBtnIcon.className = "fa-solid fa-expand text-sky-400";
            }
        }

        // Sync Fullscreen icon on escape/exit
        document.addEventListener('fullscreenchange', () => {
            const fsBtnIcon = document.querySelector('#fullscreen-btn i');
            if (fsBtnIcon) {
                if (document.fullscreenElement) {
                    fsBtnIcon.className = "fa-solid fa-compress text-amber-400";
                } else {
                    fsBtnIcon.className = "fa-solid fa-expand text-sky-400";
                }
            }
        });

        // Loading spinner controls
        function showSpinner() {
            const spinner = document.getElementById('loading-spinner');
            spinner.style.opacity = '1';
            spinner.style.pointerEvents = 'auto';
        }

        function hideSpinner() {
            const spinner = document.getElementById('loading-spinner');
            spinner.style.opacity = '0';
            spinner.style.pointerEvents = 'none';
        }
    </script>
</body>
